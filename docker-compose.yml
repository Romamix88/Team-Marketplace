services:
  # === Redis — шина сообщений ===
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 300 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # === MCP-сервер Wildberries ===
  mcp-wb:
    build:
      context: .
      dockerfile: mcp-wb/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - WB_TOKEN_LOGISTICS=${WB_TOKEN_LOGISTICS}
      - WB_TOKEN_CONTENT=${WB_TOKEN_CONTENT}
      - WB_TOKEN_MARKETING=${WB_TOKEN_MARKETING}
      - WB_TOKEN_ANALYST=${WB_TOKEN_ANALYST}
      - WB_TOKEN_ACCOUNTANT=${WB_TOKEN_ACCOUNTANT}
      - WB_TOKEN_MANAGER=${WB_TOKEN_MANAGER}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # === Telegram-бот ===
  telegram-bot:
    build:
      context: .
      dockerfile: telegram-bot/Dockerfile
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - REDIS_URL=redis://redis:6379/0
      - MCP_WB_URL=http://mcp-wb:8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      mcp-wb:
        condition: service_started
    restart: unless-stopped

  # === Веб-дашборд ===
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
