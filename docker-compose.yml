services:
  # === Redis — шина сообщений ===
  redis:
    image: redis:7-alpine
    # Порт НЕ пробрасывается наружу — доступен только внутри Docker-сети
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 300 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # === MCP-сервер Wildberries ===
  mcp-wb:
    build:
      context: .
      dockerfile: mcp-wb/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - WB_TOKEN_LOGISTICS=${WB_TOKEN_LOGISTICS}
      - WB_TOKEN_CONTENT=${WB_TOKEN_CONTENT}
      - WB_TOKEN_MARKETING=${WB_TOKEN_MARKETING}
      - WB_TOKEN_ANALYST=${WB_TOKEN_ANALYST}
      - WB_TOKEN_ACCOUNTANT=${WB_TOKEN_ACCOUNTANT}
      - WB_TOKEN_MANAGER=${WB_TOKEN_MANAGER}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # === Агент: Аналитик (Фаза 1) ===
  agent-wb-analyst:
    build:
      context: .
      dockerfile: agents/wb-analyst/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MCP_WB_URL=http://mcp-wb:8001
      - ROUTERAI_API_KEY=${ROUTERAI_API_KEY}
      - ROUTERAI_BASE_URL=${ROUTERAI_BASE_URL:-https://api.routerai.ru/v1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      mcp-wb:
        condition: service_started
    restart: unless-stopped

  # === Агент: Логист (Фаза 1) ===
  agent-wb-logistics:
    build:
      context: .
      dockerfile: agents/wb-logistics/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MCP_WB_URL=http://mcp-wb:8001
      - ROUTERAI_API_KEY=${ROUTERAI_API_KEY}
      - ROUTERAI_BASE_URL=${ROUTERAI_BASE_URL:-https://api.routerai.ru/v1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      mcp-wb:
        condition: service_started
    restart: unless-stopped

  # === Агент: Руководитель (Фаза 3) ===
  agent-wb-manager:
    build:
      context: .
      dockerfile: agents/wb-manager/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MCP_WB_URL=http://mcp-wb:8001
      - ROUTERAI_API_KEY=${ROUTERAI_API_KEY}
      - ROUTERAI_BASE_URL=${ROUTERAI_BASE_URL:-https://api.routerai.ru/v1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      mcp-wb:
        condition: service_started
    restart: unless-stopped

  # === Агент: Бухгалтер (Фаза 3) ===
  agent-wb-accountant:
    build:
      context: .
      dockerfile: agents/wb-accountant/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MCP_WB_URL=http://mcp-wb:8001
      - ROUTERAI_API_KEY=${ROUTERAI_API_KEY}
      - ROUTERAI_BASE_URL=${ROUTERAI_BASE_URL:-https://api.routerai.ru/v1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      mcp-wb:
        condition: service_started
    restart: unless-stopped

  # === Агент: Контент-менеджер (Фаза 2) ===
  agent-wb-content:
    build:
      context: .
      dockerfile: agents/wb-content/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MCP_WB_URL=http://mcp-wb:8001
      - ROUTERAI_API_KEY=${ROUTERAI_API_KEY}
      - ROUTERAI_BASE_URL=${ROUTERAI_BASE_URL:-https://api.routerai.ru/v1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      mcp-wb:
        condition: service_started
    restart: unless-stopped

  # === Агент: Маркетолог (Фаза 2) ===
  agent-wb-marketing:
    build:
      context: .
      dockerfile: agents/wb-marketing/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MCP_WB_URL=http://mcp-wb:8001
      - ROUTERAI_API_KEY=${ROUTERAI_API_KEY}
      - ROUTERAI_BASE_URL=${ROUTERAI_BASE_URL:-https://api.routerai.ru/v1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      mcp-wb:
        condition: service_started
    restart: unless-stopped

  # === Telegram-бот ===
  telegram-bot:
    build:
      context: .
      dockerfile: telegram-bot/Dockerfile
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - REDIS_URL=redis://redis:6379/0
      - MCP_WB_URL=http://mcp-wb:8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      mcp-wb:
        condition: service_started
    restart: unless-stopped

  # === Веб-дашборд ===
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-changeme}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
